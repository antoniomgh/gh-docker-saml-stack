# No cambiar de nombre este archivo. Debe de ir tras ssl.conf para que se apliquen las directivas SSL a este VirtualHost.

ServerName sp.simplesamlphp.ghsamlstack.localhost
UseCanonicalName On

LogLevel info
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Host}i\" \"%{X-Forwarded-For}i\" \"%{User-Agent}i\" \"%{Referer}i\" \"%{Cookie}i\"" ghLogFormat
CustomLog /dev/stdout ghLogFormat
ErrorLog /dev/stderr

<VirtualHost *:443>
    ProxyPreserveHost On
</VirtualHost>