ServerName sp.shibboleth.ghsamlstack.localhost

LogLevel info mod_shib:trace8
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Host}i\" \"%{X-Forwarded-For}i\" \"%{User-Agent}i\" \"%{Referer}i\" \"%{Cookie}i\"" ghLogFormat
CustomLog /dev/stdout ghLogFormat
ErrorLog /dev/stderr

<VirtualHost *:80>
    ServerName https://sp.shibboleth.ghsamlstack.localhost:443
    # ServerName sp.shibboleth.ghsamlstack.localhost:443
    UseCanonicalName On

    # 2. Forzado radical de variables de entorno para el core en C++
    SetEnv HTTPS on
    SetEnv SERVER_PORT 443
    SetEnv REQUEST_SCHEME https

    DocumentRoot "/var/www/html"

    # 3. Limpieza de logs específicos para trazar ECP sin ruido
    LogLevel info mod_shib:trace8
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{PAOS}i\"" ecpLogFormat
    CustomLog /dev/stdout ecpLogFormat
    ErrorLog /dev/stderr

    # 4. El directorio protegido dedicado a ECP
    <Location /shib-protected>
        AuthType shibboleth

        # Activamos la sesión obligatoria
        ShibRequestSetting requireSession true

        # Rompemos el descubrimiento web; forzamos el iniciador nativo SAML2
        ShibRequestSetting discoveryProtocol null
        # ShibRequestSetting requireSessionWith SAML2
        ShibRequestSetting forceASSL true

        # Evitamos que scripts index.php/index.html rompan el payload SOAP si la sesión no está lista
        DirectoryIndex disabled

        Require valid-user
    </Location>

    # 5. Pasarela limpia para los Handlers de Shibboleth

    #<Location /Shibboleth.sso>
    #    SetHandler shib
    #    Satisfy Any
    #    Allow from all
    #</Location>

</VirtualHost>