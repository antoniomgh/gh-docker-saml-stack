#Rewrite Rules
#Force SSL

RewriteEngine on
ReWriteCond %{SERVER_PORT} !^443$
RewriteRule ^/(.*) https://%{HTTP_HOST}/$1 [NC,R,L]

LogLevel info
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Host}i\" \"%{X-Forwarded-For}i\" \"%{User-Agent}i\" \"%{Referer}i\" \"%{Cookie}i\"" ghLogFormat
CustomLog /dev/stdout ghLogFormat
ErrorLog /dev/stderr

<VirtualHost *:443>
    ServerName sp.simplesamlphp.ghsamlstack.localhost
    Include conf.d/includes/proxy-common.conf

    ProxyPass / http://sp.simplesamlphp.ghsamlstack.localhost/
    ProxyPassReverse / http://sp.simplesamlphp.ghsamlstack.localhost/
</VirtualHost>

<VirtualHost *:443>
    ServerName idp.simplesamlphp.ghsamlstack.localhost
    Include conf.d/includes/proxy-common.conf

    ProxyPass / http://idp.simplesamlphp.ghsamlstack.localhost/
    ProxyPassReverse / http://idp.simplesamlphp.ghsamlstack.localhost/
</VirtualHost>

<VirtualHost *:443>
    ServerName idp.shibboleth.ghsamlstack.localhost
    Include conf.d/includes/proxy-common.conf

    #Map /idp to Tomcat
    ProxyPass /idp https://idp.shibboleth.ghsamlstack.localhost:4443/idp
    ProxyPassReverse /idp https://idp.shibboleth.ghsamlstack.localhost:4443/idp
</VirtualHost>

<VirtualHost *:443>
    ServerName spxxxx.shibboleth.ghsamlstack.localhost
    Include conf.d/includes/proxy-common.conf
  ##
  ##  #ProxyPass /Shibboleth.sso http://sp.shibboleth.ghsamlstack.localhost/Shibboleth.sso
  ##  #ProxyPassReverse /Shibboleth.sso http://sp.shibboleth.ghsamlstack.localhost/Shibboleth.sso
  ##
  ##  # ProxyPreserveHost On
  ##  # ProxyPass /shib-protected http://sp.shibboleth.ghsamlstack.localhost/shib-protected
  ##  # ProxyPassReverse /shib-protected http://sp.shibboleth.ghsamlstack.localhost/shib-protected
  ##
  ##  ProxyPass / http://sp.shibboleth.ghsamlstack.localhost
  ##  ProxyPassReverse / http://sp.shibboleth.ghsamlstack.localhost
  ##
  ##
  ##  # Capturamos el contenido sin importar cómo venga escrito y lo inyectamos estrictamente en MAYÚSCULAS
  ##  SetEnvIfNoCase ^PAOS$ ^(.*)$ FIX_PAOS=$1
  ##  RequestHeader set PAOS %{FIX_PAOS}e env=FIX_PAOS
  ##
  ##  # 🚀 PASO 1: Captura la cabecera PAOS original de curl y re-inyéctala con fuerza
  ##  SetEnvIfNoCase ^PAOS$ ^(.*)$ ENFORCE_PAOS=$1
  ##  RequestHeader set PAOS %{ENFORCE_PAOS}e env=ENFORCE_PAOS
  ##
  ##  # 🚀 PASO 2: Informa al contenedor backend de que el cliente usa HTTPS
  ##  RequestHeader set X-Forwarded-Proto "https"
  ##  RequestHeader set X-Forwarded-Port "443"

    # 2. Preservar las cabeceras de Host y desactivar HTTP/2 para este flujo si es necesario
    # (HTTP/2 fuerza minúsculas en las cabeceras, lo que rompe a mod_shib en C++)
    # Protocols http/1.1
    ProxyPreserveHost On

    # 3. Pasar el tráfico al contenedor (Puerto 80)
    ProxyPass / http://sp.shibboleth.ghsamlstack.localhost/ keepalive=On
    ProxyPassReverse / http://sp.shibboleth.ghsamlstack.localhost/

    # 4. Inyectar las cabeceras que el Apache interno usará para validar el entorno seguro
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port 443

    # 5. Asegurar que la cabecera PAOS se mantenga intacta en la petición
    # Evita que filtros globales de seguridad de Apache limpien los caracteres especiales (";" o "=")
    <Location />
        # Permitir que pasen todas las cabeceras del cliente sin alteración
        ProxyAddHeaders On
    </Location>
</VirtualHost>

<VirtualHost *:443>
    ServerName sp.shibboleth.ghsamlstack.localhost
    Include conf.d/includes/proxy-common.conf

    ProxyPass / http://sp.shibboleth.ghsamlstack.localhost/ keepalive=On
    ProxyPassReverse / http://sp.shibboleth.ghsamlstack.localhost/

    # 4. Inyectar las cabeceras que el Apache interno usará para validar el entorno seguro
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port 443

    <Location />
        # Permitir que pasen todas las cabeceras del cliente sin alteración
        ProxyAddHeaders On
    </Location>
</VirtualHost>

